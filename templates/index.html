<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{data.nama_toko}}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet">
       <style>
            .store-title {
                font-family: Georgia, 'Times New Roman', Times, serif;    
                font-size:300%;
                color:#1F2A44;
            }

            .product-image {
                height: 210px;
                object-fit: cover;
                flex: 1 1 auto;
            }

            .lead {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color:#1F2A44;
            }

            .location {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color:#1F2A44;
            }

            .buy-now-button {
                --bs-btn-bg: #1F2A44;
                --bs-btn-border-color: #182136;
                --bs-btn-hover-bg: #182136;
                --bs-btn-hover-border-color: #182136;
                --bs-btn-active-bg: #182136;
                --bs-btn-active-border-color: #182136;
            }
        </style> 
</head>
<body style="background-color: #f6faff;">
    <div class="container mt-5 text-center">
        <h1 class="store-title"><b>{{data.nama_toko}}</b></h1>
        <p class="lead">{{data.slogan}}</p>
        <p class="location mb-5">{{data.lokasi}}</p>
    
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous"></script>

    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3">
            {% for p in produk %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ url_for('static', filename='upload/' ~ p.id_produk ~ '.jpg') }}" 
                    class="card-img-top product-image" alt="{{p.nama_produk}}">

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{p.nama_produk}}</h5>
                        <p class="card-text">Rp {{ "{:,.2f}".format(p.harga) }}</p>
                        <a href="{{ url_for('product_detail', id_produk=p.id_produk) }}" class="btn btn-primary buy-now-button mt-auto">Beli Sekarang</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
