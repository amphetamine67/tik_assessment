<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Detail - {{data.nama_produk}}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <style>
            .navbar-brand {
                font-family: Georgia, 'Times New Roman', Times, serif;    
                font-size:200%;
                color:#ffffff;
                margin-left: 9px;
            }

            .bg-custom {
                background-color: #1F2A44;
            }

            .text-price {
                font-family:Arial, Helvetica, sans-serif;   
                font: 100%;
                color:#1F2A44;
            }

            .btn-secondary {
                --bs-btn-bg: #1F2A44;
                --bs-btn-border-color: #182136;
                --bs-btn-hover-bg: #182136;
                --bs-btn-hover-border-color: #182136;
                --bs-btn-active-bg: #182136;
                --bs-btn-active-border-color: #182136;
            }
        </style>

    </head>

    <body style="background-color: #f6faff;">
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-custom">
            <div class="container">
                <a class="navbar-brand" href="/">{{ data.nama_toko }}</a>
                
            </div>
        </nav>

        <main class="container mt-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row align-items-center g-4">
                        <div class="col-md-6 text-center">
                            <img src="{{ url_for('static', filename='upload/' ~ data.id_produk ~ '.jpg') }}"
                                 class="img-fluid rounded" alt="{{ data.nama_produk }}"
                                 style="max-height: 320px; object-fit: contain;">
                        </div>

                        <div class="col-md-6">
                            <h2>{{ data.nama_produk }}</h2>
                            <h3 class="text-price"><b>Rp {{ "{:,.2f}".format(data.harga) }}</b></h3>
                            <p>Produk tersedia di {{ data.nama_toko }}</p>
                            <p>{{ data.lokasi }}</p>

                            {% if data.wa_link %}
                            <a href="{{ data.wa_link }}" class="btn btn-success btn-lg mt-3 me-2" target="_blank" rel="noopener">
                                Beli via Whatsapp
                            </a>
                            {% endif %}
                            <a href="{{ url_for('home') }}" class="btn btn-secondary btn-lg mt-3">
                                Kembali ke Beranda
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
